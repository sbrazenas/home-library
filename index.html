<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Reading Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,ital@9..144,300..700,0..1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0e18; --bg-deep: #05060c; --panel: #131729;
    --panel-line: rgba(232,230,223,0.1); --text: #e9e6dc; --muted: #8b8fa8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% -10%, #12172a 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color: var(--text); font-family:'Inter',sans-serif;
  }
  .app{ position:relative; height:100vh; }
  svg{ width:100%; height:100%; display:block; touch-action:none; }

  header{
    position:absolute; top:0; left:0; right:0; z-index:5;
    padding: 20px 26px 10px;
    display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px;
    pointer-events:none;
  }
  .titleblock .eyebrow{
    font-size:10px; letter-spacing:0.16em; text-transform:uppercase;
    color: var(--muted); margin-bottom:4px; font-weight:500;
  }
  .titleblock h1{
    font-family:'Fraunces',serif; font-weight:500; font-style:italic;
    font-size: clamp(18px,2.2vw,25px); margin:0; letter-spacing:-0.01em;
  }
  .meta{ font-size:11px; color:var(--muted); text-align:right; line-height:1.5; max-width:230px; }
  .meta strong{ color:var(--text); font-weight:600; }

  .legend{
    position:absolute; top:88px; left:26px; z-index:5;
    display:flex; flex-direction:column; gap:5px;
    background: rgba(19,23,41,0.6);
    border:1px solid var(--panel-line); border-radius:12px; padding:11px 13px;
    pointer-events:none; max-width:190px;
  }
  .legend .item{ display:flex; align-items:center; gap:7px; font-size:10.5px; color:var(--muted); line-height:1.3; }
  .legend .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }

  .zoomctl{
    position:absolute; bottom:20px; left:26px; z-index:6;
    display:flex; flex-direction:column; gap:4px;
  }
  .zoomctl button{
    width:32px; height:32px; border-radius:8px;
    background: rgba(19,23,41,0.75); border:1px solid var(--panel-line);
    color:var(--text); font-size:16px; cursor:pointer; font-family:'Inter';
  }
  .zoomctl button:hover{ background: rgba(255,255,255,0.1); }

  .hint{
    position:absolute; bottom:20px; right:30px; z-index:5;
    font-size:10.5px; color:var(--muted); opacity:0.7; text-align:right;
    pointer-events:none;
  }

  .link{ stroke-linecap:round; }
  .link.dim{ opacity:0.04 !important; }
  .link.lit{ opacity:0.9 !important; stroke-width:1.6 !important; }

  .node{ cursor:pointer; }
  .node circle.core{ cursor:pointer; }
  .node text{
    font-family:'Fraunces', serif; font-size:9.5px; font-weight:400;
    fill: var(--muted); pointer-events:none;
  }
  .node.dim{ opacity:0.12; }
  .node.lit circle.core{ fill-opacity:1; }
  .node.lit text{ fill: var(--text); }
  .node.selected circle.core{ stroke: var(--text); stroke-width:1.6px; }

  .card{
    position:absolute; bottom:20px; left:70px; z-index:6;
    width: 370px; max-width: calc(100vw - 100px);
    background: var(--panel); border:1px solid var(--panel-line); border-radius:14px;
    padding:15px 18px;
    opacity:0; transform:translateY(8px); pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .card.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .card .book-title{ font-family:'Fraunces',serif; font-style:italic; font-size:16px; margin:0 0 2px; }
  .card .book-author{ font-size:11px; color:var(--muted); margin:0 0 8px; }
  .card .blurb{ font-size:12px; color:var(--text); line-height:1.5; margin:0 0 11px; }
  .card .branches-label{
    font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);
    margin: 0 0 7px; padding-top:9px; border-top:1px solid var(--panel-line);
  }
  .card .chips{ display:flex; flex-wrap:wrap; gap:5px; max-height:120px; overflow-y:auto; }
  .chip{
    font-family:'Inter'; font-size:10.5px; padding:4px 9px 4px 7px; border-radius:999px;
    border:1px solid var(--panel-line); background:rgba(255,255,255,0.03);
    color: var(--text); cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .chip:hover{ background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.3); }
  .chip .cdot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .edge-tip{
    position:fixed; z-index:20; pointer-events:none;
    background: var(--panel); border:1px solid var(--panel-line); border-radius:9px;
    padding:8px 11px; max-width:230px; font-size:11.5px; line-height:1.4; color:var(--text);
    opacity:0; transform:translateY(4px); transition: opacity .12s ease, transform .12s ease;
  }
  .edge-tip.show{ opacity:1; transform:translateY(0); }
  .card .close{
    position:absolute; top:11px; right:13px; cursor:pointer; color:var(--muted);
    font-size:15px; line-height:1; background:none; border:none; padding:4px;
  }
  .card .close:hover{ color:var(--text); }

  @media (max-width:640px){
    header{ padding:14px 14px 6px; }
    .legend{ display:none; }
    .hint{ display:none; }
    .card{ left:14px; right:14px; width:auto; }
    .zoomctl{ left:auto; right:14px; top:92px; bottom:auto; flex-direction:row; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="titleblock">
      <div class="eyebrow">Sam's Physical Library</div>
      <h1>Pick your path</h1>
    </div>
  </header>

  <div class="legend" id="legend"></div>
  <div class="zoomctl">
    <button id="zoomIn">+</button>
    <button id="zoomOut">−</button>
    <button id="zoomReset">⤢</button>
  </div>
  <div class="hint">drag a book to move it · click to explore</div>

  <svg id="svg" viewBox="0 0 2200 1500" preserveAspectRatio="xMidYMid meet"></svg>

  <div class="card" id="card">
    <button class="close" id="closeCard">×</button>
    <p class="book-title" id="cardTitle"></p>
    <p class="book-author" id="cardAuthor"></p>
    <p class="blurb" id="cardBlurb"></p>
    <p class="branches-label">branches from here</p>
    <div class="chips" id="cardChips"></div>
  </div>
  <div class="edge-tip" id="edgeTip"></div>
</div>

<script>
const THEME_COLORS = {
  root: '#f2efe6',
  coming: '#d98c4a',
  relationships: '#d98ba0',
  behaviour: '#a83d56',
  meaning: '#e8c468',
  spiritual: '#7fb88f',
  wonder: '#6fc0cf',
  power: '#7f93b8',
  ambition: '#9b8bb4',
};
const THEME_LABELS = {
  coming: 'Coming of Age', relationships: 'Relationships & People', behaviour: 'Human Behaviour',
  meaning: 'Meaning & the Examined Self', spiritual: 'Spiritual Paths & Pilgrimage',
  wonder: 'Wonder & the Cosmic Unknown', power: 'Power, Control & Rebellion', ambition: 'Ambition & the Art of Building'
};

const NODES = [
  { id:'dark-matter', t:'Dark Matter', a:'Blake Crouch', theme:'root', blurb:"A physicist is abducted into a machine that sends him through countless alternate versions of his own life, fighting to get back to the one that's really his — your current read." },

  // Coming of Age
  { id:'enders-game', t:"Ender's Game", a:'Orson Scott Card', theme:'coming', blurb:'A brilliant child is trained at a military academy to command Earth\u2019s fleet against an alien invasion, not realizing how real the "simulations" actually are.' },
  { id:'enders-shadow', t:"Ender's Shadow", a:'Orson Scott Card', theme:'coming', blurb:'The same Battle School war, retold through Bean — a starving orphan genius recruited alongside Ender who sees the whole program differently.' },
  { id:'shadow-puppets', t:'Shadow Puppets', a:'Orson Scott Card', theme:'coming', blurb:'Bean and the other child-genius war heroes become pawns in the political power struggles that consume Earth once the alien threat is gone.' },
  { id:'funny-story', t:"It's Kind of a Funny Story", a:'Ned Vizzini', theme:'coming', blurb:'An overachieving, depressed teenager checks himself into a psychiatric hospital after a suicidal episode, and lands on the adult ward by mistake.' },
  { id:'freedom-writers', t:'The Freedom Writers Diary', a:'Erin Gruwell', theme:'coming', blurb:'A first-year teacher gets her at-risk, gang-affected students to keep anonymous diaries about their lives, and it transforms the whole classroom.' },
  { id:'great-expectations', t:'Great Expectations', a:'Charles Dickens', theme:'coming', blurb:'An orphan blacksmith\u2019s apprentice is suddenly given a fortune by a secret benefactor and remade into a gentleman — with consequences he never expected.' },
  { id:'caged-bird', t:'I Know Why the Caged Bird Sings', a:'Maya Angelou', theme:'coming', blurb:"Maya Angelou's memoir of her childhood in the segregated South, including trauma and displacement, and how she found her voice through reading and writing." },
  { id:'treasure-island', t:'Treasure Island', a:'Robert Louis Stevenson', theme:'coming', blurb:'A boy finds a dead pirate\u2019s treasure map and sails off with a crew that turns out to be secretly plotting mutiny.' },
  { id:'their-eyes', t:'Their Eyes Were Watching God', a:'Zora Neale Hurston', theme:'coming', blurb:'A Black woman in the Jim Crow South moves through three very different marriages in her search for real love and self-determination.' },
  { id:'catcher-rye', t:'The Catcher in the Rye', a:'J.D. Salinger', theme:'coming', blurb:'A teenage boy wanders New York City alone for a few days after being expelled from prep school, unraveling more with every encounter.' },
  { id:'beneath-wheel', t:'Beneath the Wheel', a:'Hermann Hesse', theme:'coming', blurb:'A gifted small-town student is pushed relentlessly toward academic success by his school and father until the pressure breaks him.' },
  { id:'knight-seven-kingdoms', t:'A Knight of the Seven Kingdoms', a:'George R.R. Martin', theme:'coming', blurb:'Novellas following a young squire and his wandering hedge-knight master through Westeros, generations before Game of Thrones.' },
  { id:'born-crime', t:'Born a Crime', a:'Trevor Noah', theme:'coming', blurb:"Trevor Noah's memoir of growing up mixed-race in apartheid and post-apartheid South Africa, where his very existence had been illegal." },
  { id:'all-quiet', t:'All Quiet on the Western Front', a:'Erich Maria Remarque', theme:'coming', blurb:'German teenagers volunteer for World War I filled with patriotic idealism, then are physically and psychologically destroyed by trench warfare.' },
  { id:'natural-woman', t:'A Natural Woman', a:'Carole King', theme:'coming', blurb:'Carole King\u2019s memoir of her life and career, from teenage Brill Building songwriter to one of the defining singer-songwriters of the 1970s.' },

  // Relationships & People
  { id:'madame-bovary', t:'Madame Bovary', a:'Gustave Flaubert', theme:'relationships', blurb:'A bored provincial doctor\u2019s wife pursues affairs and reckless spending to escape a marriage and life that bore her, with ruinous results.' },
  { id:'pride-prejudice', t:'Pride and Prejudice', a:'Jane Austen', theme:'relationships', blurb:'A sharp-tongued woman and a proud, wealthy man have to overcome their own snap judgments of each other before they can fall in love.' },
  { id:'emma', t:'Emma', a:'Jane Austen', theme:'relationships', blurb:'A wealthy, well-meaning young woman keeps meddling in everyone else\u2019s love lives while remaining completely blind to her own heart.' },
  { id:'farewell-arms', t:'A Farewell to Arms', a:'Ernest Hemingway', theme:'relationships', blurb:'An American ambulance driver on the Italian front falls in love with a British nurse while World War I dismantles everything around them.' },
  { id:'wuthering-heights', t:'Wuthering Heights', a:'Emily Brontë', theme:'relationships', blurb:'An orphan\u2019s all-consuming love for the woman he grew up with curdles into a cycle of obsession and revenge that outlasts both of them.' },
  { id:'jane-eyre', t:'Jane Eyre', a:'Charlotte Brontë', theme:'relationships', blurb:'An orphaned governess falls for her brooding, wealthy employer, only to discover a dark secret locked away in his house.' },
  { id:'of-mice-men', t:'Of Mice and Men', a:'John Steinbeck', theme:'relationships', blurb:'Two Depression-era migrant workers dream of saving up to own a small farm together, undone by one man\u2019s disability and the world\u2019s cruelty.' },
  { id:'four-loves', t:'The Four Loves', a:'C.S. Lewis', theme:'relationships', blurb:'C.S. Lewis breaks love down into four distinct kinds — affection, friendship, romance, and unconditional charity — and examines what each actually requires.' },
  { id:'twelve-minutes', t:'Twelve Minutes of Love: A Tango Story', a:'Kapka Kassabova', theme:'relationships', blurb:'A journalist\u2019s memoir of falling for Argentine tango — and the community, obsession, and men she found inside the dance.' },
  { id:'all-way-river', t:'All the Way to the River', a:'Elizabeth Gilbert', theme:'relationships', blurb:'Elizabeth Gilbert\u2019s memoir of loving a close friend through her terminal illness and addiction, and what staying by her side actually cost.' },
  { id:'ten-year-affair', t:'The Ten Year Affair', a:'Erin Somers', theme:'relationships', blurb:'A woman starts imagining an alternate life where she chose a different man on the night she met her husband — and the fantasy starts bleeding into her real marriage.' },
  { id:'high-fidelity', t:'High Fidelity', a:'Nick Hornby', theme:'relationships', blurb:'A record store owner, freshly dumped, revisits his all-time worst breakups trying to figure out what\u2019s actually wrong with him.' },
  { id:'night-day', t:'Night and Day', a:'Virginia Woolf', theme:'relationships', blurb:'A young Edwardian woman weighs a sensible marriage proposal against the pull of real, inconvenient passion.' },
  { id:'tale-two-cities', t:'A Tale of Two Cities', a:'Charles Dickens', theme:'relationships', blurb:'A dissolute lawyer sacrifices himself for the woman he loves and her husband during the bloodiest days of the French Revolution.' },
  { id:'kin', t:'Kin', a:'Tayari Jones', theme:'relationships', blurb:'A family gathers for a funeral and is forced to confront a long-buried secret that one of them has been protecting for years.' },
  { id:'freya', t:'Freya', a:'Anthony Quinn', theme:'relationships', blurb:'Two friends\u2019 decades-long relationship is tested by ambition, feminism, and the very different lives they each choose in postwar Britain.' },
  { id:'lost-boys', t:'Lost Boys', a:'Orson Scott Card', theme:'relationships', blurb:'A Mormon family\u2019s move to a new town coincides with their young son\u2019s growing obsession with an imaginary friend — and a creeping sense that something is deeply wrong.' },
  { id:'best-offer-wins', t:'Best Offer Wins', a:'Marisa Kashino', theme:'relationships', blurb:'A woman desperate to win a brutal housing bidding war starts making increasingly unhinged decisions to secure her dream home.' },
  { id:'lightbreakers', t:'Lightbreakers', a:'Aja Gabel', theme:'relationships', blurb:'A tight circle of young musicians\u2019 friendship and creative partnership fractures under the weight of ambition, love, and time.' },

  // Human Behaviour
  { id:'crime-punishment', t:'Crime and Punishment', a:'Fyodor Dostoyevsky', theme:'behaviour', blurb:'A poor former student murders a pawnbroker to test his theory that great men are above ordinary morality, then can\u2019t live with what he\u2019s done.' },
  { id:'the-gambler', t:'The Gambler', a:'Fyodor Dostoyevsky', theme:'behaviour', blurb:'A young tutor\u2019s addiction to roulette destroys his finances, his dignity, and his chance with the woman he loves.' },
  { id:'dorian-gray', t:'The Picture of Dorian Gray', a:'Oscar Wilde', theme:'behaviour', blurb:'A beautiful young man stays eternally young while a portrait of him grows more grotesque with every sin he commits.' },
  { id:'interview-vampire', t:'Interview with the Vampire', a:'Anne Rice', theme:'behaviour', blurb:'A 200-year-old vampire recounts his entire life, guilt, and losses to a journalist over one long, unbroken interview.' },
  { id:'red-dragon', t:'Red Dragon', a:'Thomas Harris', theme:'behaviour', blurb:'A retired FBI profiler with a dangerous ability to think like killers is pulled back in to hunt a serial murderer targeting families.' },
  { id:'american-psycho', t:'American Psycho', a:'Bret Easton Ellis', theme:'behaviour', blurb:'A wealthy 1980s Wall Street banker narrates his double life as a serial killer in the same flat, obsessive detail he uses for business cards and restaurants.' },
  { id:'fight-club', t:'Fight Club', a:'Chuck Palahniuk', theme:'behaviour', blurb:'An insomniac office worker and a charismatic stranger start an underground fight club that spirals into an anti-consumerist movement neither of them can control.' },
  { id:'choke', t:'Choke', a:'Chuck Palahniuk', theme:'behaviour', blurb:'A sex addict who cons strangers into "saving" his life by fake-choking in restaurants tries to fund his mother\u2019s care while everything else falls apart.' },
  { id:'midnight-garden', t:'Midnight in the Garden of Good and Evil', a:'John Berendt', theme:'behaviour', blurb:'A journalist embedded with a lavish, eccentric Savannah antiques dealer gets pulled into the murder trial that follows a shooting in his mansion.' },
  { id:'requiem-dream', t:'Requiem for a Dream', a:'Hubert Selby Jr.', theme:'behaviour', blurb:'Four New Yorkers\u2019 addictions — to heroin, diet pills, and a TV game-show fantasy — destroy their lives in parallel, one relapse at a time.' },
  { id:'sanctuary', t:'Sanctuary', a:'William Faulkner', theme:'behaviour', blurb:'A kidnapped college student\u2019s brutal ordeal exposes the violence and corruption hiding underneath small-town Mississippi respectability.' },
  { id:'art-thinking-clearly', t:'The Art of Thinking Clearly', a:'Rolf Dobelli', theme:'behaviour', blurb:'A rundown of nearly 100 common cognitive biases and reasoning errors, each explained in a page or two.' },
  { id:'blink', t:'Blink', a:'Malcolm Gladwell', theme:'behaviour', blurb:'Malcolm Gladwell argues that snap judgments are often as good as, or better than, careful deliberate analysis — and digs into when they badly fail.' },
  { id:'pursuit-loneliness', t:'The Pursuit of Loneliness', a:'Philip Slater', theme:'behaviour', blurb:'A sociologist argues that American culture\u2019s obsession with independence and privacy is quietly making everyone more isolated and unhappy.' },
  { id:'molka', t:'Molka', a:'Monika Kim', theme:'behaviour', blurb:'A Korean office worker targeted by hidden spy-cam footage of her turns to bloody revenge with the help of her dead sister\u2019s ghost.' },
  { id:'vanity-fair', t:'Vanity Fair', a:'William Makepeace Thackeray', theme:'behaviour', blurb:'Two women — one ruthlessly scheming, one passively naive — claw their way through British society using very different strategies, with a narrator who trusts neither.' },
  { id:'circus-bulgaria', t:'Circus Bulgaria', a:'Deyan Enev', theme:'behaviour', blurb:'A collection of short, often dark stories capturing ordinary Bulgarians pushed into strange and absurd situations.' },
  { id:'heart-of-glass', t:'Heart of Glass', a:'Jennifer Hillier', theme:'behaviour', blurb:'A serial killer recants his decades-old murder confession, forcing two former best friends to confront the secret they\u2019ve kept since their childhood friend was killed at a small-town amusement park.' },
  { id:'brookmyre-1', t:'Not the End of the World', a:'Christopher Brookmyre', theme:'behaviour', blurb:'A washed-up rock star\u2019s comeback tour stop on a private island collides with a hostage crisis, a doomsday cult, and a very reluctant hero.' },
  { id:'brookmyre-2', t:'Attack of the Unsinkable Rubber Ducks', a:'Christopher Brookmyre', theme:'behaviour', blurb:'A tabloid journalist investigating a death threat against her stumbles into a much bigger murder conspiracy in Scotland.' },
  { id:'brookmyre-3', t:'A Big Boy Did It and Ran Away', a:'Christopher Brookmyre', theme:'behaviour', blurb:'A group of spectacularly inept would-be terrorists\u2019 plot keeps collapsing in increasingly farcical ways.' },
  { id:'brookmyre-4', t:'Be My Enemy', a:'Christopher Brookmyre', theme:'behaviour', blurb:'A journalist\u2019s college reunion turns into a conspiracy involving an old flame, a private security firm, and a body count.' },

  // Meaning & the Examined Self
  { id:'happy-death', t:'A Happy Death', a:'Albert Camus', theme:'meaning', blurb:'A young man kills a disabled acquaintance for his money, believing wealth will let him live a fuller life, and then has to figure out what that actually means.' },
  { id:'the-fall', t:'The Fall', a:'Albert Camus', theme:'meaning', blurb:'A former Paris lawyer confesses his hidden moral failures and hypocrisy to a stranger in an Amsterdam bar, one drink at a time.' },
  { id:'devil-good-lord', t:'The Devil & the Good Lord', a:'Jean-Paul Sartre', theme:'meaning', blurb:'A ruthless mercenary captain, bored of being evil, decides to become perfectly good instead — and finds that just as destructive.' },
  { id:'age-of-reason', t:'The Age of Reason', a:'Jean-Paul Sartre', theme:'meaning', blurb:'A philosophy teacher in 1930s Paris spends a frantic 24 hours trying to scrape together money for his girlfriend\u2019s abortion while avoiding any real commitment to anything.' },
  { id:'confessions', t:'Confessions', a:'Saint Augustine', theme:'meaning', blurb:'Augustine\u2019s account of his sinful youth and eventual conversion to Christianity, written as one long, searching prayer addressed directly to God.' },
  { id:'sickness-unto-death', t:'The Sickness Unto Death', a:'Søren Kierkegaard', theme:'meaning', blurb:'Kierkegaard\u2019s philosophical treatise defining despair as a mismatch between who you are and who you\u2019re meant to become — and how faith is the only way out.' },
  { id:'present-age', t:'The Present Age', a:'Søren Kierkegaard', theme:'meaning', blurb:'Kierkegaard\u2019s essay arguing that his era had replaced real passion and commitment with detached, anxious spectating — a diagnosis that still lands.' },
  { id:'short-life-kierkegaard', t:'A Short Life of Kierkegaard', a:'Walter Lowrie', theme:'meaning', blurb:'A concise biography of Kierkegaard\u2019s brief, tormented life — a broken engagement, public ridicule, and a body of work written against the clock.' },
  { id:'beyond-good-evil', t:'Beyond Good and Evil', a:'Friedrich Nietzsche', theme:'meaning', blurb:'Nietzsche argues that traditional morality is a historical accident dressed up as universal truth, and sketches what might replace it.' },
  { id:'zarathustra', t:'Thus Spoke Zarathustra', a:'Friedrich Nietzsche', theme:'meaning', blurb:'A prophet descends from his mountain to teach humanity about self-overcoming, eternal recurrence, and the death of God, in dense poetic parables.' },
  { id:'five-dialogues', t:'Five Dialogues', a:'Plato', theme:'meaning', blurb:'Five of Plato\u2019s early dialogues, including Socrates\u2019 trial and death, showing his method of relentlessly questioning everyone\u2019s assumptions.' },
  { id:'ethics-aristotle', t:'Ethics', a:'Aristotle', theme:'meaning', blurb:'Aristotle\u2019s foundational argument that a good life is built through habitual virtue and practical wisdom, not by following rules.' },
  { id:'analects', t:'The Analects', a:'Confucius', theme:'meaning', blurb:'A collection of Confucius\u2019s sayings and conversations with his students on ethics, government, and how to live an ordered life.' },
  { id:'meditations', t:'Meditations', a:'Marcus Aurelius', theme:'meaning', blurb:'The private notebook of a Roman emperor, reminding himself entry by entry how to stay disciplined, humble, and unbothered by things outside his control.' },
  { id:'existentialist-cafe', t:'At the Existentialist Café', a:'Sarah Bakewell', theme:'meaning', blurb:'A group biography of Sartre, de Beauvoir, Camus, and Heidegger, told through their ideas, feuds, love affairs, and Paris café culture.' },
  { id:'existentialism-predicament', t:'Existentialism and the Modern Predicament', a:'Ed. William Barrett', theme:'meaning', blurb:'An anthology of existentialist writing framed as a direct response to the alienation and meaninglessness of modern industrial life.' },
  { id:'second-sex', t:'The Second Sex', a:'Simone de Beauvoir', theme:'meaning', blurb:'De Beauvoir\u2019s foundational feminist argument that "woman" is a social role imposed on people, not a biological destiny — "one is not born, but rather becomes, a woman."' },
  { id:'sophie-world', t:"Sophie's World", a:'Jostein Gaarder', theme:'meaning', blurb:'A Norwegian teenager starts receiving mysterious letters that walk her through the entire history of Western philosophy — wrapped in a mystery she\u2019s also living inside.' },

  // Spiritual Paths & Pilgrimage
  { id:'tao-te-ching', t:'Tao Te Ching', a:'Lao Tzu', theme:'spiritual', blurb:'A short collection of ancient Taoist verses on living in harmony with the natural flow of things instead of forcing outcomes.' },
  { id:'bhagavad-gita', t:'The Bhagavad-Gita', a:'Anonymous', theme:'spiritual', blurb:'A warrior prince, paralyzed by doubt on the eve of battle against his own relatives, is counseled by a god on duty, action, and letting go of the outcome.' },
  { id:'siddhartha', t:'Siddhartha', a:'Hermann Hesse', theme:'spiritual', blurb:'A young man living alongside the Buddha abandons every teacher and doctrine he encounters to find enlightenment entirely through his own experience.' },
  { id:'zen-motorcycle', t:'Zen and the Art of Motorcycle Maintenance', a:'Robert M. Pirsig', theme:'spiritual', blurb:'A father and son\u2019s cross-country motorcycle trip becomes the frame for the narrator\u2019s philosophical meditation on quality, technology, and his own past breakdown.' },
  { id:'lila', t:'Lila', a:'Robert M. Pirsig', theme:'spiritual', blurb:'Pirsig\u2019s follow-up to Zen and the Art of Motorcycle Maintenance: a boat trip down the Hudson with a troubled woman becomes the occasion for more of his philosophy of "Quality."' },

function reasonFor(idA, idB){
  const key = [idA, idB].slice().sort().join('|');
  if(EDGE_REASONS[key]) return EDGE_REASONS[key];
  const na = nodeById[idA], nb = nodeById[idB];
  if(na && nb && na.theme === nb.theme && THEME_LABELS[na.theme]){
    return `Both part of ${THEME_LABELS[na.theme]}.`;
  }
  return 'Connected through the library web.';
}

function circulantEdges(arr){
  const n = arr.length, out = [];
  [1,2].forEach(off => {
    for(let i=0;i<n;i++){
      out.push([arr[i], arr[(i+off)%n]]);
    }
  });
  return out;
}

let RAW = [...HAND_EDGES];
CLUSTERS.forEach(arr => { RAW = RAW.concat(circulantEdges(arr)); });

const seen = new Set();
const EDGE_PAIRS = RAW.filter(([a,b]) => {
  const key = [a,b].slice().sort().join('|');
  if(seen.has(key)) return false;
  seen.add(key);
  return true;
});

const nodeById = {};
NODES.forEach(n => nodeById[n.id] = n);
const neighbors = {};
NODES.forEach(n => neighbors[n.id] = []);
EDGE_PAIRS.forEach(([a,b]) => { neighbors[a].push(b); neighbors[b].push(a); });
const edges = EDGE_PAIRS.map(([a,b]) => ({ source: nodeById[a], target: nodeById[b] }));

/* ---------- initial positions ---------- */
const W = 2200, H = 1500, CX = W/2, CY = H/2;
NODES.forEach((n, i) => {
  if(n.id === 'dark-matter'){ n.x = CX; n.y = CY; }
  else {
    const ang = (i / NODES.length) * Math.PI * 2;
    const rad = 380 + (i % 7) * 55;
    n.x = CX + Math.cos(ang) * rad;
    n.y = CY + Math.sin(ang) * rad * 0.78;
  }
  n.vx = 0; n.vy = 0; n.fx = null; n.fy = null;
});

/* ---------- legend ---------- */
const legendEl = document.getElementById('legend');

  const item = document.createElement('div');
  item.className = 'item';

  legendEl.appendChild(item);
});

/* ---------- build SVG ---------- */
const svgNS = 'http://www.w3.org/2000/svg';
const svgEl = document.getElementById('svg');
const zoomG = document.createElementNS(svgNS, 'g');
svgEl.appendChild(zoomG);
const g = document.createElementNS(svgNS, 'g');
zoomG.appendChild(g);

const linkEls = edges.map(e => {
  const line = document.createElementNS(svgNS, 'line');
  line.setAttribute('class', 'link');
  line.setAttribute('stroke', THEME_COLORS[e.source.theme] || '#8b8fa8');
  line.setAttribute('stroke-width', '0.9');
  line.setAttribute('stroke-opacity', '0.22');
  g.appendChild(line);
  return line;
});

const nodeEls = NODES.map(n => {
  const ng = document.createElementNS(svgNS, 'g');
  ng.setAttribute('class', 'node');

  const hit = document.createElementNS(svgNS, 'circle');
  hit.setAttribute('r', 18);
  hit.setAttribute('fill', 'transparent');
  ng.appendChild(hit);

  const core = document.createElementNS(svgNS, 'circle');
  core.setAttribute('class', 'core');
  core.setAttribute('r', 5);
  core.setAttribute('fill', THEME_COLORS[n.theme]);
  core.setAttribute('fill-opacity', '0.72');
  ng.appendChild(core);

  const label = document.createElementNS(svgNS, 'text');
  label.setAttribute('text-anchor', 'middle');
  label.setAttribute('dy', -10);
  label.textContent = n.t.length > 24 ? n.t.slice(0,22) + '…' : n.t;
  ng.appendChild(label);

  g.appendChild(ng);

  let dragging = false;
  function toLocalPoint(evt){
    const pt = svgEl.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(g.getScreenCTM().inverse());
  }
  ng.addEventListener('pointerdown', (evt) => {
    evt.stopPropagation();
    dragging = true;
    ng.setPointerCapture(evt.pointerId);
    const p = toLocalPoint(evt);
    n.fx = p.x; n.fy = p.y;
    selectNode(n.id);
  });
  ng.addEventListener('pointermove', (evt) => {
    if(!dragging) return;
    const p = toLocalPoint(evt);
    n.fx = p.x; n.fy = p.y;
  });
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    n.fx = null; n.fy = null;
  }
  ng.addEventListener('pointerup', endDrag);
  ng.addEventListener('pointercancel', endDrag);
  ng.addEventListener('click', (evt) => { evt.stopPropagation(); selectNode(n.id); });

  return ng;
});

/* ---------- pan & zoom ---------- */
const isMobile = window.innerWidth < 640;
let view = isMobile
  ? { x: -(W/2)*0.7, y: -(H/2)*0.7, k: 1.7 }
  : { x: 0, y: 0, k: 1 };
function applyView(){
  zoomG.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
}
applyView();
function screenToOuter(evt){
  const pt = svgEl.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(svgEl.getScreenCTM().inverse());
}
function zoomBy(factor, centerPt){
  const p = centerPt || { x: W/2, y: H/2 };
  const newK = Math.max(0.35, Math.min(4, view.k * factor));
  view.x = p.x - (newK/view.k) * (p.x - view.x);
  view.y = p.y - (newK/view.k) * (p.y - view.y);
  view.k = newK;
  applyView();
}
svgEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  const p = screenToOuter(e);
  zoomBy(e.deltaY < 0 ? 1.12 : 0.89, p);
}, { passive:false });

let panning = false, panStart = null, panViewStart = null;
// unified pointer-based pan + pinch — single pointer pans, a second pointer
// switches to pinch-zoom, so touch and mouse never fight each other
const activePointers = new Map();
let pinchDist = null;

function midpointOf(pts){
  return { clientX: (pts[0].x+pts[1].x)/2, clientY: (pts[0].y+pts[1].y)/2 };
}

svgEl.addEventListener('pointerdown', (e) => {
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(activePointers.size === 2){
    panning = false;
    const pts = [...activePointers.values()];
    pinchDist = Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y);
  } else if(activePointers.size === 1){
    panning = true;
    panStart = screenToOuter(e);
    panViewStart = { ...view };
  }
  deselect();
});
svgEl.addEventListener('pointermove', (e) => {
  if(!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if(activePointers.size === 2 && pinchDist){
    const pts = [...activePointers.values()];
    const dist = Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y);
    const factor = dist / pinchDist;
    const p = screenToOuter(midpointOf(pts));
    zoomBy(factor, p);
    pinchDist = dist;
  } else if(activePointers.size === 1 && panning){
    const cur = screenToOuter(e);
    view.x = panViewStart.x + (cur.x - panStart.x);
    view.y = panViewStart.y + (cur.y - panStart.y);
    applyView();
  }
});
function releasePointer(e){
  activePointers.delete(e.pointerId);
  if(activePointers.size < 2) pinchDist = null;
  if(activePointers.size === 1){
    const [remaining] = activePointers.values();
    panning = true;
    panStart = screenToOuter({ clientX: remaining.x, clientY: remaining.y });
    panViewStart = { ...view };
  } else if(activePointers.size === 0){
    panning = false;
  }
}
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);

document.getElementById('zoomIn').onclick = () => zoomBy(1.3);
document.getElementById('zoomOut').onclick = () => zoomBy(0.77);
document.getElementById('zoomReset').onclick = () => { view = {x:0,y:0,k:1}; applyView(); };

/* ---------- simple force simulation ---------- */
const REPULSION = 21000;
const SPRING_K = 0.016;
const IDEAL_LEN = 78;
const CENTER_K = 0.0026;
const DAMPING = 0.86;
const PAD = 40;

function tick(){
  const n = NODES.length;
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      const a = NODES[i], b = NODES[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let distSq = dx*dx + dy*dy;
      if(distSq < 1) distSq = 1;
      const dist = Math.sqrt(distSq);
      const force = REPULSION / distSq;
      const fx = (force * dx) / dist, fy = (force * dy) / dist;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }
  }
  edges.forEach(e => {
    const a = e.source, b = e.target;
    let dx = b.x - a.x, dy = b.y - a.y;
    let dist = Math.sqrt(dx*dx + dy*dy) || 0.01;
    const diff = dist - IDEAL_LEN;
    const force = SPRING_K * diff;
    const fx = (force * dx) / dist, fy = (force * dy) / dist;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  });
  NODES.forEach(nd => {
    nd.vx += (CX - nd.x) * CENTER_K;
    nd.vy += (CY - nd.y) * CENTER_K;
  });
  NODES.forEach(nd => {
    if(nd.fx !== null && nd.fx !== undefined){
      nd.x = nd.fx; nd.y = nd.fy; nd.vx = 0; nd.vy = 0;
    } else {
      nd.vx *= DAMPING; nd.vy *= DAMPING;
      const speed = Math.sqrt(nd.vx*nd.vx + nd.vy*nd.vy);
      if(speed > 16){ nd.vx = (nd.vx/speed)*16; nd.vy = (nd.vy/speed)*16; }
      nd.x += nd.vx; nd.y += nd.vy;
      nd.x = Math.max(PAD, Math.min(W-PAD, nd.x));
      nd.y = Math.max(PAD, Math.min(H-PAD, nd.y));
    }
  });
  linkEls.forEach((line, i) => {
    const e = edges[i];
    line.setAttribute('x1', e.source.x); line.setAttribute('y1', e.source.y);
    line.setAttribute('x2', e.target.x); line.setAttribute('y2', e.target.y);
  });
  nodeEls.forEach((ng, i) => {
    ng.setAttribute('transform', `translate(${NODES[i].x},${NODES[i].y})`);
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- selection & card ---------- */
const card = document.getElementById('card');
document.getElementById('closeCard').addEventListener('click', (e) => { e.stopPropagation(); deselect(); });

function selectNode(id){
  const n = nodeById[id];
  const nbrs = new Set(neighbors[id]);

  nodeEls.forEach((ng, i) => {
    const nd = NODES[i];
    const isSelf = nd.id === id;
    const isNbr = nbrs.has(nd.id);
    ng.classList.toggle('lit', isSelf || isNbr);
    ng.classList.toggle('dim', !isSelf && !isNbr);
    ng.classList.toggle('selected', isSelf);
  });
  linkEls.forEach((line, i) => {
    const e = edges[i];
    const involved = e.source.id === id || e.target.id === id;
    line.classList.toggle('lit', involved);
    line.classList.toggle('dim', !involved);
  });

  document.getElementById('cardTitle').textContent = n.t;
  document.getElementById('cardAuthor').textContent = n.a;
  document.getElementById('cardBlurb').textContent = n.blurb;

  const chips = document.getElementById('cardChips');
  chips.innerHTML = '';
  neighbors[id].forEach(nid => {
    const nb = nodeById[nid];
    const chip = document.createElement('div');
    chip.className = 'chip';
    const dot = document.createElement('span');
    dot.className = 'cdot';
    dot.style.background = THEME_COLORS[nb.theme];
    chip.appendChild(dot);
    const label = document.createElement('span');
    label.textContent = nb.t;
    chip.appendChild(label);
    chip.addEventListener('click', (e) => { e.stopPropagation(); selectNode(nid); });
    const reason = reasonFor(id, nid);
    chip.addEventListener('mouseenter', (e) => showEdgeTip(e, reason));
    chip.addEventListener('mousemove', (e) => positionEdgeTip(e));
    chip.addEventListener('mouseleave', hideEdgeTip);
    chips.appendChild(chip);
  });

  card.classList.add('show');
}

const edgeTip = document.getElementById('edgeTip');
function showEdgeTip(evt, text){
  edgeTip.textContent = text;
  positionEdgeTip(evt);
  edgeTip.classList.add('show');
}
function positionEdgeTip(evt){
  const pad = 14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if(x + 240 > window.innerWidth) x = evt.clientX - 240 - pad;
  if(y + 60 > window.innerHeight) y = evt.clientY - 60 - pad;
  edgeTip.style.left = x + 'px';
  edgeTip.style.top = y + 'px';
}
function hideEdgeTip(){ edgeTip.classList.remove('show'); }

function deselect(){
  nodeEls.forEach(ng => ng.classList.remove('lit','dim','selected'));
  linkEls.forEach(line => line.classList.remove('lit','dim'));
  card.classList.remove('show');
}
</script>
